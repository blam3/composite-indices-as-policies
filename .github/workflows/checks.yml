name: checks
permissions:
  contents: read

# Deliberately light. The real gate is `run_all.sh`, which needs hundreds of
# megabytes of ACS data that is not in this repo and cannot run in CI. What CI
# can do is guarantee that nothing merges with a syntax error, an unparseable
# results manifest, or a committed data file.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Every R file parses
        run: |
          Rscript -e '
            fs <- list.files(".", pattern="[.][Rr]$", recursive=TRUE, full.names=TRUE)
            fs <- fs[!grepl("^[.]/(data|[.]git)/", fs)]
            bad <- character(0)
            for (f in fs) {
              ok <- tryCatch({ parse(f); TRUE }, error=function(e) { message(f, ": ", conditionMessage(e)); FALSE })
              if (!ok) bad <- c(bad, f)
            }
            cat(length(fs), "R files parsed;", length(bad), "failed\n")
            if (length(bad)) quit(status=1)
          '

      - name: Ranking boundary checks
        run: Rscript tests/check_pipeline.R

      - name: Reproduction tooling checks
        run: python3 -m unittest discover -s tests

      - name: Results manifest is valid JSON and carries the reproduction gate
        run: |
          python3 - <<'PY'
          import json, sys, pathlib
          p = pathlib.Path("analysis/louisiana/results/EXPECTED-RESULTS.json")
          if not p.exists():
              raise SystemExit("Committed results manifest is missing")
          d = json.loads(p.read_text())
          assert "deterministic" in d, "manifest must be split into deterministic / monte_carlo"
          assert "monte_carlo" in d, "manifest must be split into deterministic / monte_carlo"
          print("manifest OK:", sorted(d["deterministic"])[:8])
          PY

      - name: No raw or derived input files committed (including nested data directories)
        run: |
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import subprocess
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          bad = [p for p in paths if "data" in PurePosixPath(p).parts and PurePosixPath(p).name not in {"README.md", ".gitkeep"}]
          if bad:
              raise SystemExit("Data files must not be committed: " + ", ".join(bad))
          print("Input data directories are clean")
          PY
